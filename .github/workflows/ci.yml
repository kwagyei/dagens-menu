name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR replaces its run; on main every run finishes, so a deploy is never
  # cut off halfway between the migrations and the second site.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shipped migrations are unchanged
        run: node scripts/check-migrations.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:node

  db:
    name: Database tests (workerd + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations apply to an empty local D1
        run: |
          printf '{"name":"ci","compatibility_date":"2026-10-01","d1_databases":[{"binding":"DB","database_name":"ci","database_id":"00000000-0000-0000-0000-000000000000","migrations_dir":"migrations"}]}' > wrangler.ci.json
          npx wrangler d1 migrations apply ci --local --config wrangler.ci.json --persist-to /tmp/d1
      - run: npm run test:db

  build:
    name: Build and crawl ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: bistro
            title: Bistro Norden
          - site: westafrican
            title: Chez Abena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: ${{ matrix.site }}
      - name: Local D1 with the site's content
        run: |
          npm run db:migrate:local
          npm run seed -- --site ${{ matrix.site }}
      - name: Serve the built Worker
        run: |
          npx wrangler dev --port 8788 --persist-to .wrangler/state > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && exit 0; sleep 1; done
          cat wrangler-dev.log; exit 1
      - name: All 14 routes render, and nothing third-party loads before consent
        run: node scripts/check-no-third-party.mjs --url http://localhost:8788 --title "${{ matrix.title }}"

  # The deploy gate: the owner's journeys and the security model, no retries. The tester's
  # edge-case sweeps run in e2e-edge.yml, which never blocks a deploy.
  e2e:
    name: Admin end to end (Chromium, virtual passkeys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The Playwright config builds the bistro, seeds a local D1 and serves it with a
      # throwaway session secret.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ADR-011 plan M3.7. Only main, and only after every check above: merging is deploying. The
  # production environment (main only) holds the Cloudflare token, which only the two wrangler
  # steps see, so no install script from `npm ci` can read a token that writes production D1.
  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, db, build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dagens-menu-bistro.kwabenasasuboakye.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations go first: code that needs a new table must never be live before it exists.
      # Both sites share one database, so this runs once.
      - name: Apply new migrations to the production database
        run: npx wrangler d1 migrations apply dagens-menu --remote --config wrangler.bistro.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # One site at a time: build (no token), deploy (token), smoke-test the live Worker (no
      # token). dist/ holds one site, so the second build only starts after the first deploy.
      - name: Build Bistro Norden
        run: npx astro build
        env:
          SITE: bistro
      - name: Deploy Bistro Norden
        run: npx wrangler deploy --tag "${GITHUB_SHA::12}" --message "${GITHUB_SHA} run ${GITHUB_RUN_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test Bistro Norden
        run: node scripts/smoke.mjs --url https://dagens-menu-bistro.kwabenasasuboakye.workers.dev --title "Bistro Norden" --build "${GITHUB_SHA::12}"
      - name: Build Chez Abena
        run: npx astro build
        env:
          SITE: westafrican
      - name: Deploy Chez Abena
        run: npx wrangler deploy --tag "${GITHUB_SHA::12}" --message "${GITHUB_SHA} run ${GITHUB_RUN_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test Chez Abena
        run: node scripts/smoke.mjs --url https://dagens-menu-westafrican.kwabenasasuboakye.workers.dev --title "Chez Abena" --build "${GITHUB_SHA::12}"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy of \`${GITHUB_SHA::12}\`"
            echo "- Bistro Norden: https://dagens-menu-bistro.kwabenasasuboakye.workers.dev"
            echo "- Chez Abena: https://dagens-menu-westafrican.kwabenasasuboakye.workers.dev"
            echo "- Worker versions are tagged \`${GITHUB_SHA::12}\`; roll back with \`wrangler rollback\`."
          } >> "$GITHUB_STEP_SUMMARY"
