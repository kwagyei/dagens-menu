name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:node

  db:
    name: Database tests (workerd + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations apply to an empty local D1
        run: |
          printf '{"name":"ci","compatibility_date":"2026-10-01","d1_databases":[{"binding":"DB","database_name":"ci","database_id":"00000000-0000-0000-0000-000000000000","migrations_dir":"migrations"}]}' > wrangler.ci.json
          npx wrangler d1 migrations apply ci --local --config wrangler.ci.json --persist-to /tmp/d1
      - run: npm run test:db

  build:
    name: Build and crawl ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: bistro
            title: Bistro Norden
          - site: westafrican
            title: Chez Abena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: ${{ matrix.site }}
      - name: Local D1 with the site's content
        run: |
          npm run db:migrate:local
          npm run seed -- --site ${{ matrix.site }}
      - name: Serve the built Worker
        run: |
          npx wrangler dev --port 8788 --persist-to .wrangler/state > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && exit 0; sleep 1; done
          cat wrangler-dev.log; exit 1
      - name: All 14 routes render, and nothing third-party loads before consent
        run: node scripts/check-no-third-party.mjs --url http://localhost:8788 --title "${{ matrix.title }}"
