name: CI

on:
  push:
    branches: [main]
    # A merge that changes only Markdown (README, CLAUDE.md, notes) can't change the live
    # sites, so it doesn't run CI on main, and so doesn't deploy. Its PR has already run every
    # check. Any merge that also touches code, config or migrations deploys as usual.
    # tests/ci-paths.test.ts keeps Markdown out of what the build reads.
    paths-ignore:
      - "**/*.md"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR replaces its run; on main every run finishes, so a deploy is never
  # cut off halfway between the migrations and the second site.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Shipped migrations are unchanged
        run: node scripts/check-migrations.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:node

  db:
    name: Database tests (workerd + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations apply to an empty local D1
        run: |
          printf '{"name":"ci","compatibility_date":"2026-10-01","d1_databases":[{"binding":"DB","database_name":"ci","database_id":"00000000-0000-0000-0000-000000000000","migrations_dir":"migrations"}]}' > wrangler.ci.json
          npx wrangler d1 migrations apply ci --local --config wrangler.ci.json --persist-to /tmp/d1
      - run: npm run test:db

  build:
    name: Build and crawl ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: bistro
            title: Bistro Norden
          - site: westafrican
            title: Chez Abena
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: ${{ matrix.site }}
      # On main, this build is the one the deploy ships, so production runs the bytes this job
      # crawls (review L6). Uploaded before wrangler dev starts, so nothing the local server
      # writes can reach production. include-hidden-files keeps dist/client/.assetsignore.
      - name: Keep the build for the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.site }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Local D1 with the site's content
        run: |
          npm run db:migrate:local
          npm run seed -- --site ${{ matrix.site }}
      - name: Serve the built Worker
        run: |
          npx wrangler dev --port 8788 --persist-to .wrangler/state > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && exit 0; sleep 1; done
          cat wrangler-dev.log; exit 1
      - name: All 14 routes render, and nothing third-party loads before consent
        run: node scripts/check-no-third-party.mjs --url http://localhost:8788 --title "${{ matrix.title }}"
      # Every listed curated photo has its WebP sizes, and every public photo uses them (M6.9).
      - name: Every curated photo has its sizes
        run: npm run -s image-variants -- --site ${{ matrix.site }} --check
      - name: Every public photo has width, height and srcset, and its sizes are served
        run: node scripts/check-images.mjs --url http://localhost:8788

  # The deploy gate: the owner's journeys and the security model, no retries. The tester's
  # edge-case sweeps run in e2e-edge.yml, which never blocks a deploy.
  e2e:
    name: Admin end to end (Chromium, virtual passkeys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The Playwright config builds the bistro, seeds a local D1 and serves it with a
      # throwaway session secret.
      - run: npm run test:e2e
      # The admin takes each site's colours, so its accessibility is checked on both demos.
      - name: Accessibility and keyboard on the West African admin
        run: npx playwright test --project=gate tests/e2e/a11y.spec.ts tests/e2e/keyboard.spec.ts
        env:
          E2E_SITE: westafrican
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ADR-011 plan M3.7. Only main, and only after every check above: merging is deploying. The
  # production environment (main only) holds the Cloudflare token, which only the wrangler
  # steps see, so no install script from `npm ci` can read a token that writes production D1.
  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, db, build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dagens-menu-bistro.kwabenasasuboakye.workers.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations go first: code that needs a new table must never be live before it exists.
      # Both sites share one database, so this runs once.
      - name: Apply new migrations to the production database
        run: npx wrangler d1 migrations apply dagens-menu --remote --config wrangler.bistro.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The builds the build job crawled, one artifact per site, from this run. Nothing is
      # rebuilt here (review L6): wrangler deploys builds/<site>/ as it is.
      - name: Fetch the tested builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: builds/
      # One site at a time: deploy (token), then smoke-test the live Worker (no token), so a
      # broken bistro stops the run before Chez Abena changes. If the second smoke test fails,
      # docs/deploy-runbook.md covers the half-deployed state.
      - name: Deploy Bistro Norden
        run: npx wrangler deploy --config builds/dist-bistro/server/wrangler.json --tag "${GITHUB_SHA::12}" --message "${GITHUB_SHA} run ${GITHUB_RUN_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test Bistro Norden
        run: node scripts/smoke.mjs --url https://dagens-menu-bistro.kwabenasasuboakye.workers.dev --title "Bistro Norden" --build "${GITHUB_SHA::12}"
      - name: Deploy Chez Abena
        run: npx wrangler deploy --config builds/dist-westafrican/server/wrangler.json --tag "${GITHUB_SHA::12}" --message "${GITHUB_SHA} run ${GITHUB_RUN_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test Chez Abena
        run: node scripts/smoke.mjs --url https://dagens-menu-westafrican.kwabenasasuboakye.workers.dev --title "Chez Abena" --build "${GITHUB_SHA::12}"
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy of \`${GITHUB_SHA::12}\`"
            echo "- Bistro Norden: https://dagens-menu-bistro.kwabenasasuboakye.workers.dev"
            echo "- Chez Abena: https://dagens-menu-westafrican.kwabenasasuboakye.workers.dev"
            echo "- Worker versions are tagged \`${GITHUB_SHA::12}\`; roll back with \`wrangler rollback\` (docs/deploy-runbook.md)."
          } >> "$GITHUB_STEP_SUMMARY"
