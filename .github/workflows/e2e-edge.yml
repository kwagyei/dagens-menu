name: E2E edge cases

# The tester's edge-case sweeps (tests/e2e/tester-m5-*), split from the deploy gate in ci.yml
# (review H1, 2026-10-17). They run on every PR so a reviewer sees them, and nightly so a
# time-of-day or ordering problem shows up without a PR. Nothing here blocks a deploy: the
# deploy job in ci.yml needs only the gate. A failed nightly run opens (or comments on) an
# issue, so it becomes a task instead of a red mark nobody looks at.

on:
  pull_request:
  schedule:
    # 22:30 UTC is 23:30 or 00:30 in Stockholm, so the dates either side of midnight get exercised.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The edge project is split into six shards (Playwright cuts the ordered list of specs into equal-sized chunks, so more shards also means the slow files land apart). Each shard
  # is its own runner, so it has its own wrangler dev server and its own local D1: the specs
  # share nothing across shards. Six cut the run from about 12 minutes to about a third of that.
  edge:
    name: Admin edge cases, shard ${{ matrix.shard }}/6 (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project=edge --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-edge-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Tester F3: the per-site isolation test in security.spec.ts needs a westafrican Worker on
  # the same local D1 as the bistro one, so the gate skips it; it runs here instead, in its own
  # job beside the shards. The Worker stays up in the background until the job ends.
  isolation:
    name: Per-site isolation (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start a westafrican Worker beside the bistro one
        run: |
          scripts/serve-westafrican.sh 8792 > westafrican.log 2>&1 &
          for _ in $(seq 1 80); do
            curl -sf -o /dev/null http://localhost:8792/ && exit 0
            sleep 3
          done
          cat westafrican.log
          exit 1
      - name: Per-site isolation against the westafrican Worker
        run: npx playwright test --project=gate tests/e2e/security.spec.ts --grep "per-site isolation"
        env:
          WESTAFRICAN_URL: http://localhost:8792
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-isolation
          path: |
            playwright-report/
            westafrican.log
          retention-days: 7

  # One issue per failed nightly, however many shards failed: the shards cannot file it
  # themselves without racing each other.
  report:
    name: File the nightly failure as an issue
    needs: [edge, isolation]
    if: always() && github.event_name != 'pull_request' && (needs.edge.result == 'failure' || needs.isolation.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly e2e edge cases failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The non-blocking edge-case specs failed on \`main\`: $RUN. The reports are attached to the run for 7 days."
          fi

  # The WebKit specs (the browser photo pipeline, standing in for iPhone Safari) run on macOS.
  # On Linux's WebKit build every one of them was signed out, though the same specs pass on macOS;
  # macOS WebKit is also the closer stand-in for iOS. macOS runners are free on a public repo.
  webkit:
    name: Photo pipeline in WebKit, macOS (non-blocking)
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium too: an owner signs in there (virtual passkeys) and the session is handed to WebKit.
      - run: npx playwright install chromium webkit
      - run: npx playwright test --project=webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7
      - name: File the nightly failure as an issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly e2e edge cases failed"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again (WebKit on macOS): $RUN"
          else
            gh issue create --title "$title" --body "The non-blocking WebKit specs failed on \`main\` (macOS): $RUN. The report is attached to the run for 7 days."
          fi
