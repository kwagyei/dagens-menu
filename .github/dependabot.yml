# Workflow actions are pinned to commit SHAs (review L6), which never move on their own.
# Dependabot opens a PR when a pinned action has a new release, updating the SHA and the
# version comment together, so the pins stay current and every bump goes through CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
